[project]
name = "email-existence-checker"
version = "1.1.0"
description = "Asynchronous email validator with SMTP, rate limiting, and checkpoint support"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["email", "validation", "smtp", "async", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dnspython>=2.8.0",
    "email-validator>=2.3.0",
]
license.file = "LICENSE"

[project.urls]
Homepage = "https://github.com/mertemr/email-existence-checker"
Repository = "https://github.com/mertemr/email-existence-checker"
Issues = "https://github.com/mertemr/email-existence-checker/issues"

[project.scripts]
email-checker = "email_existence_checker.cli:main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "email_existence_checker",
    "email_existence_checker.*",
]

[dependency-groups]
dev = [
    "email-existence-checker",
    "ruff>=0.14.13",
]

[tool.uv.workspace]
members = ["."]

[tool.uv.sources]
email-existence-checker = { workspace = true, editable = true }

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    ".venv",
    ".*_cache/",
    "**/tests/**",
    "**/*_tests.py"
]
fix = true
unsafe-fixes = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
preview = true

[tool.ruff.lint]
select = [
  # Flake8 rules
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "FBT", # flake8-boolean-trap
  "ISC", # flake8-implicit-str-concat
  "N",   # flake8-naming
  "PIE", # flake8-pie
  "PYI", # flake8-pyi
  "RET", # flake8-return
  "RSE", # flake8-raise
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  "TC",  # flake8-type-checking
  "TID", # flake8-tidy-imports
  # Pylint rules
  "PLC", # Convention
  "PLE", # Error
  "PLW", # Warning
  # PyCodeStyle rules
  "E", # Errors
  "W", # Warnings
  # Other tools
  "F",    # pyflakes
  "FURB", # refurb
  "I",    # isort
  "RUF",  # ruff-specific rules
  "UP",   # pyupgrade
]
